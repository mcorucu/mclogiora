name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported version, a current version, and the latest.
        php: ['7.4', '8.2', '8.4']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        run: find mclogiora.php uninstall.php src tools -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

  quality:
    name: Standards and static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Coding standards
        run: composer phpcs

      - name: Static analysis
        run: composer phpstan

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported version and a current one.
        php: ['7.4', '8.3']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run tests
        run: composer test

  integration:
    name: WordPress integration tests
    runs-on: ubuntu-latest
    env:
      # Keep the pre-release regression baseline explicit after the current
      # stable WordPress line advances beyond 7.0.
      WP_TARGET_VERSION: '7.0.4'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install the WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 "$WP_TARGET_VERSION"

      - name: Report the WordPress build under test
        run: |
          set -e
          version="$(php -r 'include "/tmp/wordpress/wp-includes/version.php"; echo $wp_version;')"
          echo "WordPress under test: ${version}"
          echo "### WordPress under test: \`${version}\`" >> "$GITHUB_STEP_SUMMARY"
          test "$version" = "$WP_TARGET_VERSION" \
            || { echo "::error::Expected ${WP_TARGET_VERSION}, found ${version}."; exit 1; }

      - name: Run integration tests
        run: composer test:integration

  wordpress-71:
    # Pinned on purpose. mcLogiora must be qualified against the exact final
    # WordPress 7.1 build, never against an RC, trunk, nightly, or floating
    # latest version.
    name: WordPress 7.1 compatibility
    runs-on: ubuntu-latest
    env:
      WP_TARGET_VERSION: '7.1'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install the WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 "$WP_TARGET_VERSION"

      - name: Report the WordPress build under test
        run: |
          set -e
          version="$(php -r 'include "/tmp/wordpress/wp-includes/version.php"; echo $wp_version;')"
          echo "WordPress under test: ${version}"
          echo "### WordPress under test: \`${version}\`" >> "$GITHUB_STEP_SUMMARY"

          test "$version" = "$WP_TARGET_VERSION" \
            || { echo "::error::Expected ${WP_TARGET_VERSION}, found ${version}."; exit 1; }

          # The release tarball ships built assets. The develop-src tree does
          # not, and core then reports its own stylesheets as missing through
          # _doing_it_wrong, which reads as a plugin failure and is not one.
          test -f /tmp/wordpress/wp-includes/css/dist/block-library/common.css \
            || { echo "::error::The WordPress tree under test is missing built assets."; exit 1; }

      - name: Run integration tests
        run: composer test:integration

  builders:
    # Elementor and ACF were qualified by hand in Phase 14, which left them
    # able to break silently when either released a new version. This job runs
    # the adapters against the current free editions on every build.
    #
    # Deliberately a small set, not a matrix: one payload-adapter builder
    # (Elementor), one whose layout is ordinary block content (Kadence), one
    # field framework (ACF), and Beaver Builder because it is the only free
    # builder that stores its layout outside post_content. Commercial builders
    # are never downloaded here.
    name: WordPress builder compatibility
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install the WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest

      - name: Install free builder plugins
        run: bash bin/install-builder-plugins.sh

      - name: Run builder compatibility tests
        # Loading third-party builders globally changes WordPress routing hooks.
        # The required integration job already runs the complete suite without
        # those plugins; this optional job owns only the builder contracts.
        run: >-
          vendor/bin/phpunit -c phpunit-integration.xml.dist
          tests/Integration/BuilderContentIntegrationTest.php
          tests/Integration/OptionalBuilderPluginTest.php

  plugin-check:
    # Official Plugin Check is run against a disposable, real WordPress 7.1
    # install. Findings are captured for release classification; this job does
    # not use provider credentials or enable AI-assisted checks.
    name: Official Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure exact WordPress 7.1 environment
        run: |
          set -euo pipefail
          rm -rf /tmp/mclogiora-package
          mkdir -p /tmp/mclogiora-package
          git archive --format=zip --worktree-attributes --prefix=mclogiora/ HEAD > mclogiora-1.0.2-pr.zip
          unzip -q mclogiora-1.0.2-pr.zip -d /tmp/mclogiora-package
          sha256sum mclogiora-1.0.2-pr.zip > mclogiora-1.0.2-pr.zip.sha256
          test -f /tmp/mclogiora-package/mclogiora/mclogiora.php
          test ! -e /tmp/mclogiora-package/mclogiora/vendor
          test ! -e /tmp/mclogiora-package/mclogiora/tests
          find /tmp/mclogiora-package/mclogiora -name '*.php' -print0 | xargs -0 -n1 php -l
          export PACKAGE_DIR=/tmp/mclogiora-package/mclogiora
          node -e '
            const fs = require("fs");
            fs.writeFileSync(".wp-env.json", JSON.stringify({
              core: "https://wordpress.org/wordpress-7.1.zip",
              port: 8880,
              testsPort: 8881,
              mappings: { "wp-content/plugins/mclogiora": process.env.PACKAGE_DIR }
            }, null, 2) + "\n");
          '
          cat .wp-env.json
          npm -g --no-fund i @wordpress/env

      - name: Start WordPress 7.1
        run: |
          npx wp-env start --update
          version="$(npx wp-env run cli wp core version)"
          echo "WordPress under test: ${version}"
          test "$version" = '7.1' \
            || { echo "::error::Expected WordPress 7.1, found ${version}."; exit 1; }

      - name: Install and activate Plugin Check 2.1.0
        run: |
          npx wp-env run cli wp plugin install plugin-check --version=2.1.0 --activate
          npx wp-env run cli wp plugin activate mclogiora

      - name: Run static and runtime Plugin Check
        run: |
          set +e
          npx wp-env run cli wp plugin check mclogiora --format=json \
            --require=./wp-content/plugins/plugin-check/cli.php \
            > plugin-check-results.json
          status=$?
          set -e
          cat plugin-check-results.json
          echo "Plugin Check exit status: ${status}"

      - name: Classify documented Plugin Check false positives
        run: |
          npx wp-env run cli wp plugin check mclogiora --format=json \
            --ignore-codes=WordPress.DB.PreparedSQL.NotPrepared,WordPressVIPMinimum.Performance.WPQueryParams.SuppressFilters_suppress_filters \
            --require=./wp-content/plugins/plugin-check/cli.php \
            > plugin-check-disposition.json
          cat plugin-check-disposition.json
          if grep -q '"type":"ERROR"' plugin-check-disposition.json; then
            echo "::error::Plugin Check reported an unclassified error after the documented disposition.";
            exit 1;
          fi

      - name: Upload Plugin Check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mclogiora-plugin-check-wp71-final
          path: |
            plugin-check-results.json
            plugin-check-disposition.json
            mclogiora-1.0.2-pr.zip
            mclogiora-1.0.2-pr.zip.sha256

  upgrade:
    # Exercise the real file replacement path from the last release. The
    # current package is loaded only after 1.0.1 has been activated and its
    # legacy state has been seeded.
    name: 1.0.1 to 1.0.2 upgrade
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare 1.0.1 package and WordPress 7.1
        run: |
          set -euo pipefail
          rm -rf /tmp/mclogiora-upgrade
          mkdir -p /tmp/mclogiora-upgrade
          git archive --worktree-attributes 35da688 | tar -x -C /tmp/mclogiora-upgrade
          node -e '
            const fs = require("fs");
            fs.writeFileSync(".wp-env.json", JSON.stringify({
              core: "https://wordpress.org/wordpress-7.1.zip",
              port: 8880,
              testsPort: 8881,
              mappings: { "wp-content/plugins/mclogiora": "/tmp/mclogiora-upgrade" }
            }, null, 2) + "\n");
          '
          npm -g --no-fund i @wordpress/env
          npx wp-env start --update
          version="$(npx wp-env run cli wp core version)"
          test "$version" = '7.1'

      - name: Activate 1.0.1 and seed legacy state
        run: |
          set -euo pipefail
          npx wp-env run cli wp plugin activate mclogiora
          npx wp-env run cli wp option update mclogiora_suggestion_key_openai legacy-openai --quiet
          npx wp-env run cli wp option update mclogiora_suggestion_key_anthropic legacy-anthropic --quiet
          npx wp-env run cli wp option update mclogiora_suggestion_key_gemini legacy-gemini --quiet
          npx wp-env run cli wp option update mclogiora_suggestion_model_openai legacy-model --quiet
          npx wp-env run cli wp option update mclogiora_suggestions_provider gemini --quiet
          npx wp-env run cli wp option update mclogiora_suggestion_key_deepl preserve-this --quiet

      - name: Replace package with exact 1.0.2 tree
        run: |
          set -euo pipefail
          find /tmp/mclogiora-upgrade -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          git archive --format=zip --worktree-attributes --prefix=mclogiora/ HEAD > /tmp/mclogiora-1.0.2-upgrade.zip
          unzip -q /tmp/mclogiora-1.0.2-upgrade.zip -d /tmp/mclogiora-upgrade-staged
          cp -a /tmp/mclogiora-upgrade-staged/mclogiora/. /tmp/mclogiora-upgrade/
          rm -rf /tmp/mclogiora-upgrade-staged

      - name: Assert upgrade cleanup and preservation
        run: |
          set -euo pipefail
          npx wp-env run cli wp eval '
          $removed = array(
            "mclogiora_suggestion_key_openai",
            "mclogiora_suggestion_key_anthropic",
            "mclogiora_suggestion_key_gemini",
            "mclogiora_suggestion_model_openai",
            "mclogiora_suggestions_provider",
          );
          foreach ( $removed as $option ) {
            if ( false !== get_option( $option, false ) ) {
              WP_CLI::error( "Legacy option was retained: " . $option );
            }
          }
          if ( "preserve-this" !== get_option( "mclogiora_suggestion_key_deepl", "" ) ) {
            WP_CLI::error( "DeepL credential was not preserved." );
          }
          if ( 1 !== (int) get_option( "mclogiora_suggestion_legacy_cleanup_102", 0 ) ) {
            WP_CLI::error( "Upgrade cleanup marker was not written." );
          }
          if ( "1.0.2" !== MCLOGIORA_VERSION ) {
            WP_CLI::error( "The active plugin is not 1.0.2." );
          }
          WP_CLI::success( "1.0.1 to 1.0.2 upgrade gate passed." );
          '

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject committed dependencies and local artifacts
        run: |
          if git ls-files --error-unmatch vendor node_modules 2>/dev/null; then
            echo "::error::Dependency directories must never be committed."
            exit 1
          fi
          offenders="$(git ls-files | grep -E '(^|/)(\.env($|\.)|\.DS_Store$|Thumbs\.db$|.*\.(log|bak|swp|sql|sqlite3?|dump|zip|tar|tar\.gz|tgz)$)' || true)"
          if [ -n "$offenders" ]; then
            echo "::error::Local or generated artifacts are tracked:"
            echo "$offenders"
            exit 1
          fi

      - name: Reject committed credentials
        run: |
          matches="$(git grep -nIE \
            -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e 'gh[pousr]_[A-Za-z0-9]{30,}' \
            -e 'sk-[A-Za-z0-9]{32,}' \
            -e 'xox[baprs]-[A-Za-z0-9-]{10,}' \
            -- . ':(exclude).github/workflows/ci.yml' || true)"
          if [ -n "$matches" ]; then
            echo "::error::Possible credential committed:"
            echo "$matches"
            exit 1
          fi

      - name: Confirm the plugin ships no telemetry or licensing code
        run: |
          matches="$(git grep -nIE \
            -e 'wp_remote_(get|post|request|head)' \
            -e 'curl_init|fsockopen' \
            -- src mclogiora.php uninstall.php || true)"
          if [ -n "$matches" ]; then
            echo "::error::Unexpected outbound HTTP call. External services need an explicit phase decision and WordPress.org disclosure:"
            echo "$matches"
            exit 1
          fi
